<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 440" width="660" height="440" font-family="'Malgun Gothic','Noto Sans KR','Noto Sans CJK KR','Apple SD Gothic Neo',sans-serif"><rect width="660" height="440" fill="#fff"/><rect x="10" y="10" width="330" height="420" rx="12" fill="#f6f8fb" stroke="#d6dde6"/><text x="30" y="40" font-size="16" fill="#1f2a37" text-anchor="start" font-weight="700">어버이</text><circle cx="120" cy="74" r="17" fill="#f2c81e" stroke="#b08f00" stroke-width="1.6"/><text x="120" y="112" font-size="16" fill="#1f2a37" text-anchor="middle" font-weight="700">YY</text><circle cx="240" cy="74" r="17" fill="#6fae3d" stroke="#3f7a1d" stroke-width="1.6"/><text x="240" y="112" font-size="16" fill="#1f2a37" text-anchor="middle" font-weight="700">yy</text><text x="180" y="80" font-size="22" fill="#1f2a37" text-anchor="middle" font-weight="400">×</text><text x="120" y="134" font-size="14.5" fill="#5b6776" text-anchor="middle" font-weight="400">생식세포 Y</text><text x="240" y="134" font-size="14.5" fill="#5b6776" text-anchor="middle" font-weight="400">생식세포 y</text><line x1="180" y1="144" x2="180" y2="176" stroke="#5b6776" stroke-width="2.4"/><polygon points="180,176 174.3,166.6 185.7,166.6" fill="#5b6776"/><text x="30" y="208" font-size="16" fill="#1f2a37" text-anchor="start" font-weight="700">자손 1대</text><circle cx="180" cy="214" r="17" fill="#f2c81e" stroke="#b08f00" stroke-width="1.6"/><text x="180" y="254" font-size="16" fill="#1f2a37" text-anchor="middle" font-weight="700">Yy (모두 노란색)</text><text x="180" y="276" font-size="14.5" fill="#5b6776" text-anchor="middle" font-weight="400">초록색은 나타나지 않음 → 노란색이 우성</text><line x1="180" y1="288" x2="180" y2="320" stroke="#5b6776" stroke-width="2.4"/><polygon points="180,320 174.3,310.6 185.7,310.6" fill="#5b6776"/><text x="180" y="340" font-size="14.5" fill="#5b6776" text-anchor="middle" font-weight="400">자가 수분</text><text x="30" y="372" font-size="16" fill="#1f2a37" text-anchor="start" font-weight="700">자손 2대</text><text x="180" y="394" font-size="17" fill="#1f2a37" text-anchor="middle" font-weight="700">노란색 : 초록색 ≈ 3 : 1</text><text x="180" y="416" font-size="15.5" fill="#5b6776" text-anchor="middle" font-weight="400">YY : Yy : yy = 1 : 2 : 1</text><rect x="352" y="10" width="298" height="420" rx="12" fill="#f6f8fb" stroke="#d6dde6"/><text x="500" y="40" font-size="16" fill="#1f2a37" text-anchor="middle" font-weight="700">Yy × Yy 의 결과</text><text x="500" y="64" font-size="13.5" fill="#5b6776" text-anchor="middle" font-weight="400">쌍이 분리되어 Y, y 가 1 : 1로 만들어진다</text><text x="468.0" y="108" font-size="18" fill="#1f2a37" text-anchor="middle" font-weight="700">Y</text><text x="564.0" y="108" font-size="18" fill="#1f2a37" text-anchor="middle" font-weight="700">y</text><text x="398" y="174.0" font-size="18" fill="#1f2a37" text-anchor="middle" font-weight="700">Y</text><text x="398" y="270.0" font-size="18" fill="#1f2a37" text-anchor="middle" font-weight="700">y</text><rect x="420" y="120" width="96" height="96" fill="#fff" stroke="#5b6776" stroke-width="1.5"/><circle cx="468.0" cy="156" r="18" fill="#f2c81e" stroke="#b08f00" stroke-width="1.6"/><text x="468.0" y="200" font-size="17" fill="#1f2a37" text-anchor="middle" font-weight="700">YY</text><rect x="516" y="120" width="96" height="96" fill="#fff" stroke="#5b6776" stroke-width="1.5"/><circle cx="564.0" cy="156" r="18" fill="#f2c81e" stroke="#b08f00" stroke-width="1.6"/><text x="564.0" y="200" font-size="17" fill="#1f2a37" text-anchor="middle" font-weight="700">Yy</text><rect x="420" y="216" width="96" height="96" fill="#fff" stroke="#5b6776" stroke-width="1.5"/><circle cx="468.0" cy="252" r="18" fill="#f2c81e" stroke="#b08f00" stroke-width="1.6"/><text x="468.0" y="296" font-size="17" fill="#1f2a37" text-anchor="middle" font-weight="700">Yy</text><rect x="516" y="216" width="96" height="96" fill="#fff" stroke="#5b6776" stroke-width="1.5"/><circle cx="564.0" cy="252" r="18" fill="#6fae3d" stroke="#3f7a1d" stroke-width="1.6"/><text x="564.0" y="296" font-size="17" fill="#1f2a37" text-anchor="middle" font-weight="700">yy</text><text x="500" y="336" font-size="13.5" fill="#5b6776" text-anchor="middle" font-weight="400">왼쪽 Y·y: 한쪽 어버이의 생식세포</text><text x="500" y="356" font-size="13.5" fill="#5b6776" text-anchor="middle" font-weight="400">위쪽 Y·y: 다른 쪽 어버이의 생식세포</text><text x="500" y="392" font-size="16" fill="#1f2a37" text-anchor="middle" font-weight="700">노란색 3칸 : 초록색 1칸</text></svg>