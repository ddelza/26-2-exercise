<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 350" width="660" height="350" font-family="'Malgun Gothic','Noto Sans KR','Noto Sans CJK KR','Apple SD Gothic Neo',sans-serif"><rect width="660" height="350" fill="#fff"/><rect x="10" y="10" width="640" height="330" rx="12" fill="#f6f8fb" stroke="#d6dde6"/><text x="330" y="40" font-size="17" fill="#1f2a37" text-anchor="middle" font-weight="700">혀를 말 수 있는 부모(Tt × Tt)에게서 태어날 자녀</text><text x="192" y="62" font-size="13.5" fill="#e0762b" text-anchor="middle" font-weight="700">어머니의 생식세포</text><text x="144.0" y="82" font-size="18" fill="#e0762b" text-anchor="middle" font-weight="700">T</text><text x="240.0" y="82" font-size="18" fill="#e0762b" text-anchor="middle" font-weight="700">t</text><text x="50" y="188" font-size="13.5" fill="#2f6fd0" text-anchor="middle" font-weight="700">아버지</text><text x="78" y="146.0" font-size="18" fill="#2f6fd0" text-anchor="middle" font-weight="700">T</text><text x="78" y="242.0" font-size="18" fill="#2f6fd0" text-anchor="middle" font-weight="700">t</text><rect x="96" y="92" width="96" height="96" fill="#fff" stroke="#5b6776" stroke-width="1.5"/><rect x="129.0" y="113.0" width="30" height="30" fill="#fff" stroke="#1f2a37" stroke-width="2.2"/><text x="144.0" y="174" font-size="17" fill="#1f2a37" text-anchor="middle" font-weight="700">TT</text><rect x="192" y="92" width="96" height="96" fill="#fff" stroke="#5b6776" stroke-width="1.5"/><circle cx="240.0" cy="128" r="15.0" fill="#fff" stroke="#1f2a37" stroke-width="2.2"/><text x="240.0" y="174" font-size="17" fill="#1f2a37" text-anchor="middle" font-weight="700">Tt</text><rect x="96" y="188" width="96" height="96" fill="#fff" stroke="#5b6776" stroke-width="1.5"/><rect x="129.0" y="209.0" width="30" height="30" fill="#fff" stroke="#1f2a37" stroke-width="2.2"/><text x="144.0" y="270" font-size="17" fill="#1f2a37" text-anchor="middle" font-weight="700">Tt</text><rect x="192" y="188" width="96" height="96" fill="#e2e8f0" stroke="#5b6776" stroke-width="1.5"/><circle cx="240.0" cy="224" r="15.0" fill="#39485a" stroke="#1f2a37" stroke-width="2.2"/><text x="240.0" y="270" font-size="17" fill="#1f2a37" text-anchor="middle" font-weight="700">tt</text><text x="330" y="112" font-size="16" fill="#1f2a37" text-anchor="start" font-weight="700">유전자형  TT : Tt : tt = 1 : 2 : 1</text><text x="330" y="150" font-size="15.5" fill="#1f2a37" text-anchor="start" font-weight="400">혀를 말 수 있음(우성) 3칸</text><text x="620" y="150" font-size="17" fill="#2f6fd0" text-anchor="end" font-weight="700">→ 3/4</text><text x="330" y="184" font-size="15.5" fill="#1f2a37" text-anchor="start" font-weight="400">혀를 말 수 없음(열성) 1칸</text><text x="620" y="184" font-size="17" fill="#e0762b" text-anchor="end" font-weight="700">→ 1/4</text><text x="330" y="232" font-size="15" fill="#1f2a37" text-anchor="start" font-weight="700">아이를 낳을 때마다 확률은 같다.</text><text x="330" y="256" font-size="14.5" fill="#5b6776" text-anchor="start" font-weight="400">첫째가 열성(tt)이어도 둘째가</text><text x="330" y="278" font-size="14.5" fill="#5b6776" text-anchor="start" font-weight="400">열성일 확률은 그대로 1/4이다.</text><text x="330" y="324" font-size="13.5" fill="#5b6776" text-anchor="middle" font-weight="400">■ ● : 혀를 말 수 없음(열성)   □ ○ : 혀를 말 수 있음(우성)</text></svg>