<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" height="280" font-family="'Malgun Gothic','Noto Sans KR','Noto Sans CJK KR','Apple SD Gothic Neo',sans-serif"><rect width="640" height="280" fill="#fff"/><rect x="10" y="10" width="300" height="260" rx="10" fill="#f6f8fb" stroke="#d6dde6"/><text x="160.0" y="36" font-size="17" fill="#1f2a37" text-anchor="middle" font-weight="700">상동 염색체 한 쌍</text><text x="160.0" y="236" font-size="14.5" fill="#5b6776" text-anchor="middle" font-weight="400">모양과 크기가 같고</text><text x="160.0" y="256" font-size="14.5" fill="#5b6776" text-anchor="middle" font-weight="400">부모에게서 하나씩 받음</text><rect x="77.7" y="57.0" width="18.0" height="55.0" rx="9.0" fill="#2f6fd0" stroke="#1f2a37" stroke-width="0.8" transform="rotate(-13 86.7 112)"/><rect x="77.7" y="112.0" width="18.0" height="55.0" rx="9.0" fill="#2f6fd0" stroke="#1f2a37" stroke-width="0.8" transform="rotate(13 86.7 112)"/><rect x="94.3" y="57.0" width="18.0" height="55.0" rx="9.0" fill="#2f6fd0" stroke="#1f2a37" stroke-width="0.8" transform="rotate(13 103.3 112)"/><rect x="94.3" y="112.0" width="18.0" height="55.0" rx="9.0" fill="#2f6fd0" stroke="#1f2a37" stroke-width="0.8" transform="rotate(-13 103.3 112)"/><rect x="207.7" y="57.0" width="18.0" height="55.0" rx="9.0" fill="#2f6fd0" stroke="#1f2a37" stroke-width="0.8" transform="rotate(-13 216.7 112)"/><rect x="207.7" y="112.0" width="18.0" height="55.0" rx="9.0" fill="#2f6fd0" stroke="#1f2a37" stroke-width="0.8" transform="rotate(13 216.7 112)"/><rect x="224.3" y="57.0" width="18.0" height="55.0" rx="9.0" fill="#2f6fd0" stroke="#1f2a37" stroke-width="0.8" transform="rotate(13 233.3 112)"/><rect x="224.3" y="112.0" width="18.0" height="55.0" rx="9.0" fill="#2f6fd0" stroke="#1f2a37" stroke-width="0.8" transform="rotate(-13 233.3 112)"/><text x="95" y="192" font-size="14.5" fill="#1f2a37" text-anchor="middle" font-weight="700">아버지에게서</text><text x="225" y="192" font-size="14.5" fill="#1f2a37" text-anchor="middle" font-weight="700">어머니에게서</text><rect x="330" y="10" width="300" height="260" rx="10" fill="#f6f8fb" stroke="#d6dde6"/><text x="480.0" y="36" font-size="17" fill="#1f2a37" text-anchor="middle" font-weight="700">같은 위치의 대립유전자</text><text x="480.0" y="236" font-size="14.5" fill="#5b6776" text-anchor="middle" font-weight="400">상동 염색체의 같은 위치에</text><text x="480.0" y="256" font-size="14.5" fill="#5b6776" text-anchor="middle" font-weight="400">같은 형질의 유전자가 있음</text><rect x="421.0" y="55.0" width="18" height="130" rx="9.0" fill="#2f6fd0" transform="rotate(0 430 120)"/><rect x="521.0" y="55.0" width="18" height="130" rx="9.0" fill="#2f6fd0" transform="rotate(0 530 120)"/><rect x="418" y="86" width="24" height="16" fill="#fff" stroke="#1f2a37"/><rect x="518" y="86" width="24" height="16" fill="#fff" stroke="#1f2a37"/><text x="430" y="99" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="700">A</text><text x="530" y="99" font-size="14" fill="#1f2a37" text-anchor="middle" font-weight="700">a</text><text x="480" y="84" font-size="14" fill="#5b6776" text-anchor="middle" font-weight="400">같은 위치</text><text x="480" y="104" font-size="14" fill="#5b6776" text-anchor="middle" font-weight="400">대립유전자</text></svg>