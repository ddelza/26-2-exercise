<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" height="280" font-family="'Malgun Gothic','Noto Sans KR','Noto Sans CJK KR','Apple SD Gothic Neo',sans-serif"><rect width="640" height="280" fill="#fff"/><rect x="10" y="10" width="300" height="260" rx="10" fill="#f6f8fb" stroke="#d6dde6"/><text x="160.0" y="36" font-size="17" fill="#1f2a37" text-anchor="middle" font-weight="700">상동 염색체 한 쌍</text><text x="160.0" y="236" font-size="14.5" fill="#5b6776" text-anchor="middle" font-weight="400">모양과 크기가 같고</text><text x="160.0" y="256" font-size="14.5" fill="#5b6776" text-anchor="middle" font-weight="400">부모에게서 하나씩 받음</text><g transform="rotate(0 95 118)"><rect x="88.0" y="68.0" width="8" height="100" rx="4.0" fill="#2f6fd0" transform="rotate(12 92 118)"/><rect x="94.0" y="68.0" width="8" height="100" rx="4.0" fill="#2f6fd0" transform="rotate(-12 98 118)"/><circle cx="95" cy="118" r="3.2" fill="#1f2a37"/></g><g transform="rotate(0 225 118)"><rect x="218.0" y="68.0" width="8" height="100" rx="4.0" fill="#e0762b" transform="rotate(12 222 118)"/><rect x="224.0" y="68.0" width="8" height="100" rx="4.0" fill="#e0762b" transform="rotate(-12 228 118)"/><circle cx="225" cy="118" r="3.2" fill="#1f2a37"/></g><text x="95" y="192" font-size="14.5" fill="#2f6fd0" text-anchor="middle" font-weight="700">아버지에게서</text><text x="225" y="192" font-size="14.5" fill="#e0762b" text-anchor="middle" font-weight="700">어머니에게서</text><rect x="330" y="10" width="300" height="260" rx="10" fill="#f6f8fb" stroke="#d6dde6"/><text x="480.0" y="36" font-size="17" fill="#1f2a37" text-anchor="middle" font-weight="700">염색 분체와 다른 점</text><text x="480.0" y="236" font-size="14.5" fill="#5b6776" text-anchor="middle" font-weight="400">염색 분체는 복제로 생겨 정보가 같고</text><text x="480.0" y="256" font-size="14.5" fill="#5b6776" text-anchor="middle" font-weight="400">상동 염색체는 서로 다를 수 있음</text><rect x="421.0" y="55.0" width="18" height="130" rx="9.0" fill="#2f6fd0" transform="rotate(0 430 120)"/><rect x="52