<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 362" width="660" height="362" font-family="'Malgun Gothic','Noto Sans KR','Noto Sans CJK KR','Apple SD Gothic Neo',sans-serif"><rect width="660" height="362" fill="#fff"/><rect x="10" y="10" width="305" height="300" rx="10" fill="#f6f8fb" stroke="#d6dde6"/><text x="162.5" y="36" font-size="17" fill="#1f2a37" text-anchor="middle" font-weight="700">자르기 전: 큰 조각 1개</text><polygon points="60,95 220,95 220,175 60,175" fill="#f5c9c0" stroke="#c0604f" stroke-width="2"/><polygon points="60,95 108.0,59.0 268.0,59.0 220,95" fill="#f9dcd5" stroke="#c0604f" stroke-width="2"/><polygon points="220,95 268.0,59.0 268.0,139.0 220,175" fill="#eeb5a9" stroke="#c0604f" stroke-width="2"/><text x="140" y="200" font-size="14.5" fill="#5b6776" text-anchor="middle" font-weight="400">가로 4 cm · 세로 2 cm · 높이 2 cm</text><text x="162" y="236" font-size="16" fill="#1f2a37" text-anchor="middle" font-weight="400">부피 16 cm³ · 표면적 40 cm²</text><text x="162" y="270" font-size="18" fill="#2f6fd0" text-anchor="middle" font-weight="700">표면적 ÷ 부피 = 2.5</text><rect x="345" y="10" width="305" height="300" rx="10" fill="#f6f8fb" stroke="#d6dde6"/><text x="497.5" y="36" font-size="17" fill="#1f2a37" text-anchor="middle" font-weight="700">자른 뒤: 작은 조각 2개</text><polygon points="372,95 452,95 452,175 372,175" fill="#f5c9c0" stroke="#c0604f" stroke-width="2"/><polygon points="372,95 420.0,59.0 500.0,59.0 452,95" fill="#f9dcd5" stroke="#c0604f" stroke-width="2"/><polygon points="452,95 500.0,59.0 500.0,139.0 452,175" fill="#eeb5a9" stroke="#c0604f" stroke-width="2"/><polygon points="498,95 578,95 578,175 498,175" fill="#f5c9c0" stroke="#c0604f" stroke-width="2"/><polygon points="498,95 546.0,59.0 626.0,59.0 578,95" fill="#f9dcd5" stroke="#c0604f" stroke-width="2"/><polygon points="578,95 626.0,59.0 626.0,139.0 578,175" fill="#eeb5a9" stroke="#c0604f" stroke-width="2"/><text x="497" y="200" font-size="14.5" fill="#5b6776" text-anchor="middle" font-weight="400">한 변 2 cm 정육면체 2개</text><text x="497" y="236" font-size="16" fill="#1f2a37" text-anchor="middle" font-weight="400">부피 16 cm³ · 표면적 48 cm²</text><text x="497" y="270" font-size="18" fill="#e0762b" text-anchor="middle" font-weight="700">표면적 ÷ 부피 = 3</text><text x="330" y="345" font-size="16" fill="#1f2a37" text-anchor="middle" font-weight="700">전체 부피는 같아도, 작게 나누면 바깥과 닿는 면이 넓어져 물질 교환에 유리하다.</text></svg>